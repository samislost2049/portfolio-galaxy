<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManavSeva - Mobile Case Study</title>
  <link rel="stylesheet" href="styles.css?v=24">
  <style>
    .manav-page{min-height:100vh;padding:28px 30px 80px;max-width:1440px;margin:auto}
    .manav-topbar{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:80px}
    .manav-back{color:#72b85d;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    .manav-back:hover{text-decoration:underline}
    .manav-intro{max-width:720px;margin-bottom:50px}
    .manav-intro h1{font:500 clamp(58px,9vw,120px)/.9 'Playfair Display',serif;margin:14px 0 24px;color:#e9ddf4}
    .manav-intro h1 em{color:#72b85d}
    .manav-intro p:last-child{max-width:560px;color:#aa9ab8;font-size:16px}
    .manav-viewer{display:grid;grid-template-columns:1fr 320px;align-items:center;gap:clamp(35px,9vw,130px);min-height:650px;border-top:1px solid rgba(224,200,255,.16);border-bottom:1px solid rgba(224,200,255,.16);padding:55px 0}
    .manav-phone-wrap{display:flex;justify-content:center;align-items:center;position:relative}
    .manav-phone{position:relative;width:min(330px,68vw);height:min(620px,78vh);padding:12px;border:3px solid #72b85d;border-radius:42px;background:#16251d;box-shadow:0 26px 70px rgba(0,0,0,.42),0 0 48px rgba(114,184,93,.16);transform:rotate(-2deg)}
    .manav-phone-notch{position:absolute;z-index:2;top:8px;left:50%;width:86px;height:19px;border-radius:15px;background:#16251d;transform:translateX(-50%)}
    .manav-screen{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;border-radius:31px;background:#f4ede0;scrollbar-width:none;-ms-overflow-style:none}
    .manav-screen::-webkit-scrollbar{width:0;height:0;display:none}
    .manav-screen img{display:block;width:100%;height:auto;min-height:0;object-fit:initial;background:#f4ede0}
    .manav-arrow{position:absolute;top:50%;width:52px;height:52px;border:1px solid #72b85d;border-radius:50%;background:#1f5c3c;color:#f4ede0;font-size:25px;line-height:1;cursor:pointer;transform:translateY(-50%);transition:background-color .25s,transform .25s}
    .manav-arrow:hover{background:#72b85d;color:#173b2b;transform:translateY(-50%) scale(1.08)}
    .manav-prev{left:calc(50% - min(250px,37vw))}.manav-next{right:calc(50% - min(250px,37vw))}
    .manav-details{border-left:1px solid #72b85d;padding-left:28px}
    .manav-details .page-count{color:#72b85d;font-size:11px;letter-spacing:.18em}
    .manav-details h2{font:italic 500 clamp(32px,4vw,55px)/1 'Playfair Display',serif;margin:18px 0 24px;color:#e9ddf4}
    .manav-details p{color:#aa9ab8;font-size:14px;line-height:1.8;margin:0}
    .manav-note{margin-top:24px;padding-top:18px;border-top:1px solid rgba(224,200,255,.16);font-size:11px!important;letter-spacing:.03em}
    .manav-gallery{display:grid;gap:28px;border-top:1px solid rgba(224,200,255,.16);padding-top:40px}
    .manav-gallery-row{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(300px,.9fr);gap:clamp(42px,7vw,110px);align-items:center;padding-bottom:28px;border-bottom:1px solid rgba(224,200,255,.16)}
    .manav-gallery-row:nth-child(even){grid-template-columns:minmax(300px,.9fr) minmax(300px,1.1fr)}
    .manav-gallery-row:nth-child(even) .manav-phone-frame{grid-column:2;grid-row:1}
    .manav-gallery-row:nth-child(even) .manav-gallery-copy{grid-column:1;grid-row:1}
    .manav-phone-frame{width:min(360px,100%);height:min(720px,78vh);padding:12px;border:3px solid #72b85d;border-radius:42px;background:#16251d;box-shadow:0 26px 70px rgba(0,0,0,.42),0 0 48px rgba(114,184,93,.16);margin:auto;transform:rotate(-1deg)}
    .manav-phone-frame:nth-child(even){transform:rotate(1deg)}
    .manav-phone-notch{height:20px;width:92px;border-radius:15px;background:#16251d;margin:-6px auto 4px;position:relative;z-index:1}
    .manav-phone-screen{height:calc(100% - 18px);overflow-y:auto;overflow-x:hidden;border-radius:30px;background:#f4ede0;scrollbar-width:thin}
    .manav-phone-screen img{display:block;width:100%;height:auto;min-height:100%;object-fit:initial;background:#f4ede0}
    .manav-gallery-copy{border-left:1px solid #72b85d;padding-left:24px}
    .manav-gallery-copy .page-count{color:#72b85d;font-size:11px;letter-spacing:.18em}
    .manav-gallery-copy h2{font:italic 500 clamp(28px,4vw,52px)/1 'Playfair Display',serif;color:#e9ddf4;margin:16px 0 22px}
    .manav-gallery-copy p:last-child{color:#aa9ab8;font-size:14px;line-height:1.8}
    @media(max-width:760px){.manav-page{padding:20px 18px 55px}.manav-topbar{margin-bottom:55px}.manav-viewer{display:block;min-height:0;padding:40px 0}.manav-gallery-row,.manav-gallery-row:nth-child(even){grid-template-columns:1fr;gap:22px}.manav-gallery-row:nth-child(even) .manav-phone-frame,.manav-gallery-row:nth-child(even) .manav-gallery-copy{grid-column:auto;grid-row:auto}.manav-gallery-copy{border-left:0;border-top:1px solid #72b85d;padding:22px 0 0}.manav-phone-frame{height:min(620px,78vh)}}
  </style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula nebula-one" aria-hidden="true"></div>
  <div class="nebula nebula-two" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="index.html#work" aria-label="SP portfolio home">SP<span>✦</span></a>
    <a class="header-availability" href="index.html#work">Return to selected work</a>
  </header>
  <main class="manav-page">
    <div class="manav-topbar"><a class="manav-back" href="index.html#work">← Browse all projects</a><span class="eyebrow">CASE STUDY / 01</span></div>
    <section class="manav-intro">
      <p class="eyebrow" style="color:#72b85d">DONOR - NGO MOBILE PLATFORM · 2025</p>
      <h1>Manav<em>Seva.</em></h1>
      <p>A calm mobile system for donors, NGOs, volunteers, and beneficiaries to see giving become visible, trackable impact.</p>
    </section>
    <section class="manav-viewer" aria-label="Manav Seva mobile screens">
      <div class="manav-gallery" id="manav-gallery"></div>
    </section>
  </main>
  <script>
    const totalPages = 12;
    const pageNotes = [
      ['A visible path to impact.','The opening screen gives donors an immediate sense of where their support can move next.'],
      ['Trust, at a glance.','Clear status cues help people understand the health and progress of a contribution.'],
      ['The donor dashboard.','Key numbers and active causes make returning to the platform feel purposeful.'],
      ['Finding a cause.','A considered browsing rhythm helps donors discover opportunities without feeling pushed.'],
      ['The story behind giving.','Impact is framed as a human story, not only as a transaction or a number.'],
      ['A simpler contribution.','The donation path stays focused, legible, and easy to complete on a small screen.'],
      ['Support that stays visible.','Progress and follow-up information give donors a reason to return.'],
      ['Made for many roles.','The system expands beyond donors to support the wider NGO and volunteer network.'],
      ['People in the loop.','Communication tools keep action and accountability connected.'],
      ['A community view.','Shared progress turns individual contributions into a collective sense of movement.'],
      ['The next good action.','The interface closes each journey with a clear, calm next step.'],
      ['A system with room to grow.','The final screen reflects a modular product language built for future impact.']
    ];
    document.querySelector('#manav-gallery').innerHTML = pageNotes.map(([title, copy], index) => `<article class="manav-gallery-row"><div class="manav-phone-frame"><div class="manav-phone-notch"></div><div class="manav-phone-screen"><img loading="lazy" src="png-mockups/Manav-Seva/page-${String(index + 1).padStart(3,'0')}.png" alt="Manav Seva screen ${index + 1}"></div></div><div class="manav-gallery-copy"><span class="page-count">SCREEN ${String(index + 1).padStart(2,'0')} / ${totalPages}</span><h2>${title}</h2><p>${copy}</p><p class="manav-note">Scroll inside the phone to view the full screen.</p></div></article>`).join('');
  </script>
</body>
</html>
