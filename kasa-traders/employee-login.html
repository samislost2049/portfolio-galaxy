<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Team Login - KASA Traders</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .portal-page{min-height:100vh;display:grid;place-items:center;padding:7rem 1rem 3rem}.portal-card{width:min(100%,470px);padding:2.25rem;background:var(--color-forest-card);border:1px solid var(--color-gold-border);box-shadow:var(--shadow-lg)}.portal-card h1{font-family:var(--font-heading);font-size:2.45rem;line-height:1.1;margin:.8rem 0}.portal-card p{color:var(--color-ivory-muted)}.portal-form{display:grid;gap:1rem;margin-top:1.7rem}.portal-field{display:grid;gap:.35rem}.portal-field label{font-size:.8rem;color:var(--color-ivory-muted)}.portal-field input{padding:.85rem;background:var(--color-forest-dark);border:1px solid var(--color-gold-border);color:var(--color-ivory)}.portal-field input:focus{outline:2px solid var(--color-gold-light);outline-offset:2px}.portal-message{min-height:1.5rem;color:var(--color-gold-light);font-size:.88rem}.portal-message.error{color:#e8a5a5}.portal-back{display:inline-block;margin-top:1.5rem;color:var(--color-gold-light);font-size:.85rem;text-decoration:underline}
  </style>
</head>
<body>
  <main class="portal-page">
    <section class="portal-card" aria-labelledby="portal-title">
      <a href="index.html" class="brand-logo" aria-label="KASA Traders home"><div class="brand-emblem"><img src="assets/brand/kasa-k-logo.png" alt="KASA Traders logo"></div><div class="brand-text"><span class="brand-name">KASA TRADERS</span><span class="brand-sub">PRIVATE TEAM PORTAL</span></div></a>
      <span class="eyebrow eyebrow-left-only" style="display:block;margin-top:2rem">Secure access</span>
      <h1 id="portal-title">Welcome back.</h1>
      <p>Sign in with your authorised business account. Access is assigned by role.</p>
      <form class="portal-form" id="portalLoginForm">
        <div class="portal-field"><label for="loginEmail">Business email</label><input id="loginEmail" type="email" autocomplete="email" required></div>
        <div class="portal-field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-gold" type="submit">Sign in</button>
        <button class="btn btn-outline" type="button" id="magicLinkButton">Send magic link</button>
        <button class="btn btn-outline" type="button" id="resetPasswordButton">Forgot password?</button>
        <p class="portal-message" id="loginMessage" role="alert" aria-live="polite"></p>
      </form>
      <a class="portal-back" href="index.html">Return to public website</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/portal-auth.js"></script>
</body>
</html>
